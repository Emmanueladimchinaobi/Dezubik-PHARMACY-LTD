<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <link
        rel="stylesheet"
        href="./src/output.css">

    <title>Admin Dashboard</title>

</head>

<body class="bg-gray-100">

    <div class="max-w-7xl mx-auto py-10 px-6">

        <h1 class="text-4xl font-bold mb-8">
            Admin Dashboard
        </h1>


        <!-- ORDERS -->

        <section>

            <h2 class="text-2xl font-bold mb-6">
                Customer Orders
            </h2>

            <div
                id="orders"
                class="space-y-6">

            </div>

        </section>


        <!-- CUSTOMER MESSAGES -->

        <section class="mt-16">

            <h2 class="text-2xl font-bold mb-6">
                Customer Messages
            </h2>

            <div
                id="admin-messages"
                class="bg-white shadow-lg rounded-xl p-6">

                <p class="text-gray-500">
                    Loading messages...
                </p>

            </div>

        </section>

    </div>


    <!-- Socket.IO -->

    <script
        src="https://cdn.socket.io/4.8.1/socket.io.min.js">
    </script>


    <!-- Admin JavaScript -->

    <script src="./admin-orders.js"></script>

</body>

</html>
